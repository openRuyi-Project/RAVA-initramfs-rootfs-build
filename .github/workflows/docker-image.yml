name: Docker Image CI

# 构建并推送 RAVA-initramfs-rootfs-build 镜像到 hub.oepkgs.net。
# 同 guix-kernel-cross-build 的 docker-image 流水线:
#   触发            推送的 tag / 手动 dispatch
#   v*        →     <variant>-<tag> + <variant>-release
#   dev-v*    →     <variant>-<tag> + <variant>-dev
#
#   variant 由 matrix 的 base-image 决定:
#     openeuler → openeuler/openeuler:24.03-lts-sp2
#     openruyi  → git.openruyi.cn/openruyi/creek-x86-64:latest
#
#   最终镜像形如 hub.oepkgs.net/rvci/RAVA-initramfs-rootfs-build:openeuler-dev

on:
  push:
    tags:
      - "v*"
      - "dev-v*"
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'docker image tag'
        required: true
        type: string

# 同一 tag 多次 push 取消旧 run, 避免 webhook 漏触发的旧 run 抢资源
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: hub.oepkgs.net
  IMAGE_NAME: rvci/RAVA-initramfs-rootfs-build

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base-image:
          - openeuler/openeuler:24.03-lts-sp3
          - git.openruyi.cn/openruyi/creek-x86-64:latest
        include:
          - base-image: openeuler/openeuler:24.03-lts-sp3
            variant: openeuler
          - base-image: git.openruyi.cn/openruyi/creek-x86-64:latest
            variant: openruyi

    steps:
      - uses: actions/checkout@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}-${{ inputs.docker_tag || github.ref_name }}
            type=raw,value=${{ matrix.variant }}-release,enable=${{ !startsWith(github.ref, 'refs/tags/dev-v') }}
            type=raw,value=${{ matrix.variant }}-dev,enable=${{ startsWith(github.ref, 'refs/tags/dev-v') }}

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_OEPKGS_OERVCI_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OEPKGS_OERVCI_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
